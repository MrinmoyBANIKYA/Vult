<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Vult, the AI-native research desk: financial models, comps, competitor, company and market analysis, delivered in hours and traced to source."
    />
    <meta name="theme-color" content="#0b0c10" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Vult</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        if (localStorage.getItem('vult-theme') === 'light')
          document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
